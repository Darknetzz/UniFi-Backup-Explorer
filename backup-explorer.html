<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFi Backup Explorer</title>
    <script>
        (function () {
            var theme = localStorage.getItem('ube-theme');
            if (theme !== 'light' && theme !== 'dark') theme = 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --radius: 14px;
            --mono: 'IBM Plex Mono', ui-monospace, monospace;
            --sans: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        }

        /* Dark is the default */
        :root,
        [data-theme="dark"] {
            color-scheme: dark;
            --bg-1: #1a2d42;
            --bg-2: #0b1520;
            --accent: #5b8fd9;
            --accent-strong: #8bb4ea;
            --accent-soft: #1a2838;
            --accent-muted: #243548;
            --surface: #141c28;
            --surface-2: #1c2736;
            --text: #e8eef6;
            --text-muted: #94a3b8;
            --border: #2a3a4f;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            --panel-border: rgba(255, 255, 255, 0.08);
            --glow-1: rgba(80, 140, 220, 0.22);
            --glow-2: rgba(40, 90, 150, 0.18);
            --drop-drag: #2a4058;
            --code-bg: #243447;
            --error-bg: #3b1515;
            --error-border: #7f1d1d;
            --error-text: #fca5a5;
            --badge-success-bg: #14532d;
            --badge-success-text: #86efac;
            --badge-info-bg: #0c4a6e;
            --badge-info-text: #7dd3fc;
            --badge-warning-bg: #78350f;
            --badge-warning-text: #fcd34d;
            --badge-muted-bg: #334155;
            --badge-muted-text: #cbd5e1;
            --btn-shadow: rgba(91, 143, 217, 0.28);
        }

        [data-theme="light"] {
            color-scheme: light;
            --bg-1: #3d5a80;
            --bg-2: #1b3a4b;
            --accent: #4a7fd4;
            --accent-strong: #2f5fad;
            --accent-soft: #e8f0fb;
            --accent-muted: #d6e4f7;
            --surface: #ffffff;
            --surface-2: #f4f7fb;
            --text: #1a2332;
            --text-muted: #5a6a7e;
            --border: #dce5f0;
            --shadow: 0 12px 40px rgba(27, 58, 75, 0.18);
            --panel-border: rgba(255, 255, 255, 0.4);
            --glow-1: rgba(120, 180, 255, 0.35);
            --glow-2: rgba(70, 140, 200, 0.28);
            --drop-drag: #cfe0f5;
            --code-bg: #e6eef8;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #b91c1c;
            --badge-success-bg: #dcfce7;
            --badge-success-text: #166534;
            --badge-info-bg: #e0f2fe;
            --badge-info-text: #075985;
            --badge-warning-bg: #fef3c7;
            --badge-warning-text: #92400e;
            --badge-muted-bg: #e8eef5;
            --badge-muted-text: #475569;
            --btn-shadow: rgba(47, 95, 173, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--sans);
            background:
                radial-gradient(1200px 600px at 10% -10%, var(--glow-1), transparent 55%),
                radial-gradient(900px 500px at 100% 0%, var(--glow-2), transparent 50%),
                linear-gradient(155deg, var(--bg-1) 0%, var(--bg-2) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 28px 20px 40px;
            color: var(--text);
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            background: rgba(20, 28, 40, 0.55);
            color: #e8eef6;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }

        [data-theme="light"] .theme-toggle {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            background: rgba(20, 28, 40, 0.75);
        }

        [data-theme="light"] .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.32);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
        }

        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }

        [data-theme="light"] .theme-toggle .icon-sun { display: block; }
        [data-theme="light"] .theme-toggle .icon-moon { display: none; }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 28px;
        }
        
        .header h1 {
            font-size: clamp(1.85rem, 4vw, 2.45rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        }
        
        .header p {
            font-size: 1.05rem;
            opacity: 0.88;
            font-weight: 400;
            max-width: 36em;
            margin: 0 auto;
            line-height: 1.45;
        }
        
        .upload-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 36px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            position: relative;
            border: 1px solid var(--panel-border);
        }
        
        .drop-zone {
            border: 2px dashed var(--accent);
            border-radius: 12px;
            padding: 56px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
            background: var(--accent-soft);
            position: relative;
            z-index: 1;
        }
        
        .drop-zone:hover {
            border-color: var(--accent-strong);
            background: var(--accent-muted);
        }
        
        .drop-zone.drag-over {
            border-color: var(--accent-strong);
            background: var(--drop-drag);
            transform: scale(1.01);
        }
        
        .drop-zone svg {
            width: 56px;
            height: 56px;
            margin-bottom: 16px;
            color: var(--accent);
        }
        
        .drop-zone p {
            font-size: 1.15rem;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .drop-zone span {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .file-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }
        
        .info-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            display: none;
            border: 1px solid var(--panel-border);
        }
        
        .info-section.visible {
            display: block;
        }
        
        .file-info {
            margin-bottom: 28px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .file-info h2 {
            color: var(--accent-strong);
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 600;
            word-break: break-word;
            line-height: 1.35;
        }

        .file-info h2 svg {
            flex-shrink: 0;
            margin-top: 2px;
        }

        .file-info h2 .backup-filename {
            min-width: 0;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        
        .info-item {
            background: var(--surface-2);
            padding: 14px 16px;
            border-radius: 10px;
            border-left: 3px solid var(--accent);
            min-height: 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .info-item label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .info-item value {
            font-size: 0.98rem;
            color: var(--text);
            font-weight: 500;
            display: block;
            line-height: 1.35;
            word-break: break-word;
        }
        
        .info-item.download-item {
            grid-column: 1 / -1;
            border-left: none;
            background: transparent;
            padding: 4px 0 0;
            min-height: 0;
        }

        .download-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .download-actions .reset-btn {
            margin-top: 0;
            flex: 1 1 220px;
        }
        
        .data-section {
            margin-top: 8px;
        }
        
        .data-section h3 {
            color: var(--accent-strong);
            margin-bottom: 14px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .tip {
            margin-top: 18px;
            font-size: 0.88rem;
            color: var(--text-muted);
            background: var(--surface-2);
            border-radius: 8px;
            padding: 12px 14px;
            line-height: 1.45;
        }

        .tip code {
            font-family: var(--mono);
            font-size: 0.85em;
            background: var(--code-bg);
            padding: 1px 5px;
            border-radius: 4px;
        }
        
        .json-viewer {
            background: #0f1724;
            border: 1px solid #243147;
            border-radius: 10px;
            padding: 18px 20px;
            max-height: min(60vh, 520px);
            overflow: auto;
            font-family: var(--mono);
            font-size: 0.84rem;
            line-height: 1.55;
            color: #d7e0ec;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }
        
        .json-viewer pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        .bson-browser {
            display: grid;
            grid-template-columns: minmax(200px, 300px) 1fr;
            gap: 14px;
            min-height: min(72vh, 780px);
        }

        .bson-sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .bson-filter {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-2);
            color: var(--text);
            padding: 8px 10px;
            font-family: var(--sans);
            font-size: 0.88rem;
        }

        .bson-filter:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .bson-collections {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            max-height: min(70vh, 720px);
            flex: 1;
        }

        .bson-collections li button {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border: 0;
            border-bottom: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            text-align: left;
            padding: 10px 12px;
            cursor: pointer;
            font-family: var(--sans);
            font-size: 0.86rem;
        }

        .bson-collections li:last-child button {
            border-bottom: 0;
        }

        .bson-collections li button:hover {
            background: var(--accent-muted);
        }

        .bson-collections li button.active {
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-weight: 600;
        }

        .bson-collections .coll-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bson-collections .coll-count {
            flex-shrink: 0;
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .bson-main {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
            min-height: 0;
        }

        .bson-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.86rem;
        }

        .bson-toolbar .bson-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bson-toolbar button {
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 10px;
            font-family: var(--sans);
            font-size: 0.82rem;
            cursor: pointer;
        }

        .bson-toolbar button:hover:not(:disabled) {
            background: var(--accent-muted);
        }

        .bson-toolbar button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .bson-browser .json-viewer {
            flex: 1;
            max-height: min(70vh, 720px);
        }

        @media (max-width: 720px) {
            .bson-browser {
                grid-template-columns: 1fr;
            }

            .bson-collections {
                max-height: 180px;
            }
        }

        .json-viewer .json-key { color: #7dd3fc; }
        .json-viewer .json-string { color: #86efac; }
        .json-viewer .json-number { color: #fcd34d; }
        .json-viewer .json-boolean { color: #c4b5fd; }
        .json-viewer .json-null { color: #94a3b8; font-style: italic; }
        .json-viewer .json-punctuation { color: #8ba0b8; }
        .json-viewer .prop-comment { color: #64748b; font-style: italic; }
        
        .error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 10px;
            padding: 18px 20px;
            color: var(--error-text);
            margin-top: 16px;
        }

        .error-detail {
            margin-top: 8px;
            color: var(--error-text);
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            padding: 48px 24px;
            color: var(--accent-strong);
        }
        
        .spinner {
            border: 3px solid var(--accent-muted);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.85s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .reset-btn {
            background: var(--accent);
            color: white;
            border: 1px solid transparent;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .reset-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        
        .reset-btn:hover {
            background: var(--accent-strong);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--btn-shadow);
        }

        .reset-btn.btn-block {
            width: 100%;
            margin-top: 0;
        }

        .reset-btn.btn-secondary {
            background: transparent;
            color: var(--accent-strong);
            border-color: var(--accent);
            box-shadow: none;
        }

        .reset-btn.btn-secondary:hover {
            background: color-mix(in srgb, var(--accent) 14%, transparent);
            color: var(--accent-strong);
            box-shadow: none;
        }
        
        .collection-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 4px;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .collection-table th,
        .collection-table td {
            padding: 11px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .collection-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .collection-table th {
            background: var(--surface-2);
            color: var(--accent-strong);
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .collection-table td:first-child {
            font-family: var(--mono);
            font-size: 0.86rem;
            font-weight: 500;
        }

        .collection-table td:nth-child(2) {
            color: var(--text-muted);
            white-space: nowrap;
            width: 1%;
        }

        .collection-table td:nth-child(3) {
            width: 1%;
            white-space: nowrap;
        }
        
        .collection-table tbody tr {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .collection-table tbody tr:hover {
            background: var(--accent-soft);
        }
        
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            font-family: var(--mono);
            text-transform: lowercase;
            letter-spacing: 0.02em;
            min-width: 2.5rem;
            text-align: center;
        }
        
        .badge-success {
            background: var(--badge-success-bg);
            color: var(--badge-success-text);
        }
        
        .badge-info {
            background: var(--badge-info-bg);
            color: var(--badge-info-text);
        }
        
        .badge-warning {
            background: var(--badge-warning-bg);
            color: var(--badge-warning-text);
        }

        .badge-muted {
            background: var(--badge-muted-bg);
            color: var(--badge-muted-text);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 36, 0.72);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-panel {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 920px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            padding: 28px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
        }

        .modal-panel.modal-panel-wide {
            max-width: min(1480px, 98vw);
            max-height: 96vh;
        }

        .modal-panel h2 {
            color: var(--accent-strong);
            margin-bottom: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            word-break: break-all;
            line-height: 1.4;
        }

        .modal-meta {
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 400;
            margin-left: 6px;
        }

        .modal-panel .reset-btn {
            margin-top: 16px;
        }

        .modal-panel img {
            max-width: 100%;
            max-height: 70vh;
            margin-bottom: 16px;
            border-radius: 8px;
        }

        @media (max-width: 640px) {
            body { padding: 16px 12px 28px; }
            .upload-section, .info-section { padding: 22px 18px; }
            .drop-zone { padding: 40px 16px; }
            .collection-table th:nth-child(2),
            .collection-table td:nth-child(2) { display: none; }
        }
    </style>
</head>
<body>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to light mode" title="Toggle theme">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
    </button>
    <div class="container">
        <div class="header">
            <h1>UniFi Backup Explorer</h1>
            <p>Decode and explore .unf and .unifi backup files locally in your browser</p>
        </div>
        
        <div class="upload-section">
            <div class="drop-zone" id="dropZone">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p>Drop your <strong>.unf</strong> or <strong>.unifi</strong> backup file here</p>
                <span>or click to browse</span>
            </div>
            <input type="file" id="fileInput" class="file-input" accept=".unf,.unifi">
        </div>
        
        <div class="info-section" id="infoSection">
            <div class="file-info">
                <h2>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

        const BACKUP_DB_NAME = 'ube-backup-store';
        const BACKUP_DB_VERSION = 1;
        const BACKUP_STORE = 'backups';
        const BACKUP_KEY = 'current';

        function openBackupDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(BACKUP_DB_NAME, BACKUP_DB_VERSION);
                request.onerror = () => reject(request.error || new Error('Failed to open backup store'));
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains(BACKUP_STORE)) {
                        db.createObjectStore(BACKUP_STORE);
                    }
                };
            });
        }

        async function withBackupStore(mode, fn) {
            const db = await openBackupDb();
            try {
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(BACKUP_STORE, mode);
                    const store = tx.objectStore(BACKUP_STORE);
                    let request;
                    try {
                        request = fn(store);
                    } catch (err) {
                        reject(err);
                        return;
                    }

                    let settled = false;
                    const settle = (fnSettle, value) => {
                        if (settled) return;
                        settled = true;
                        fnSettle(value);
                    };

                    if (request && typeof request === 'object' && 'onsuccess' in request) {
                        request.onsuccess = () => settle(resolve, request.result);
                        request.onerror = () => settle(reject, request.error || new Error('Backup store request failed'));
                    } else {
                        tx.oncomplete = () => settle(resolve, request);
                    }

                    tx.onerror = () => settle(reject, tx.error || new Error('Backup store transaction failed'));
                    tx.onabort = () => settle(reject, tx.error || new Error('Backup store transaction aborted'));
                });
            } finally {
                db.close();
            }
        }

        async function saveCachedBackup(file, arrayBuffer) {
            await withBackupStore('readwrite', (store) => store.put({
                name: file.name,
                type: file.type || 'application/octet-stream',
                lastModified: file.lastModified || Date.now(),
                size: arrayBuffer.byteLength,
                buffer: arrayBuffer
            }, BACKUP_KEY));
        }

        async function loadCachedBackup() {
            const result = await withBackupStore('readonly', (store) => store.get(BACKUP_KEY));
            return result || null;
        }

        async function clearCachedBackup() {
            try {
                await withBackupStore('readwrite', (store) => store.delete(BACKUP_KEY));
            } catch (err) {
                console.warn('Could not clear cached backup:', err);
            }
        }

        async function restoreCachedBackup() {
            try {
                const cached = await loadCachedBackup();
                if (!cached || !cached.buffer || !cached.name) return;
                const file = new File([cached.buffer], cached.name, {
                    type: cached.type || 'application/octet-stream',
                    lastModified: cached.lastModified || Date.now()
                });
                await handleFile(file, { fromCache: true });
            } catch (err) {
                console.warn('Could not restore cached backup:', err);
                await clearCachedBackup();

            const nameLower = file.name.toLowerCase();
            const isUnf = nameLower.endsWith('.unf');
            const isUnifi = nameLower.endsWith('.unifi');

                        console.log('EOCD record ends at:', eocdEnd, 'Total file length:', decryptedBytes.length);

                        if (eocdEnd < decryptedBytes.length) {

                            decryptedBytes = decryptedBytes.slice(0, eocdEnd);

                                const fileNameLen = decryptedBytes[lfhOffset+26] | (decryptedBytes[lfhOffset+27] << 8);
                                const extraLen = decryptedBytes[lfhOffset+28] | (decryptedBytes[lfhOffset+29] << 8);
                                const compressedSize = decryptedBytes[lfhOffset+18] | (decryptedBytes[lfhOffset+19] << 8) | 
                                                      (decryptedBytes[lfhOffset+20] << 16) | (decryptedBytes[lfhOffset+21] << 24);

                                    if (!foundDescriptor) {

        function gunzipIgnoreTrailingPadding(data) {
            const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);

            const tryInflate = (buf) => {
                try {
                    const result = pako.inflate(buf);
                    if (result && result.length > 0) {
                        return result instanceof Uint8Array ? result : new Uint8Array(result);
                    }
                } catch (_) { /* invalid length or trailing junk */ }
                return null;
            };

            const direct = tryInflate(bytes);
            if (direct) return direct;

            // AES-CBC NoPadding aligns plaintext to 16 bytes; strip up to one block of
            // trailing padding so pako sees a single complete gzip member.
            for (let trim = 1; trim <= 15; trim++) {
                if (bytes.length - trim < 18) break;
                const result = tryInflate(bytes.slice(0, bytes.length - trim));
                if (result) return result;
            }

            throw new Error('Failed to gunzip .unifi payload (trailing padding?)');
        }

        function decryptAndExtractUnifi(data) {
            // UniFi OS .unifi: AES-256-CBC, IV = first 16 bytes, static 32-byte key
            const key = CryptoJS.enc.Hex.parse('e383b7c53698b36d4baea4ed22181ef73676bfd5d5b90005d9845ffd5dce985f');
            const ivBytes = data.slice(0, 16);
            let cipherBytes = data.slice(16);
            const rem = cipherBytes.length % 16;
            if (rem !== 0) {
                cipherBytes = cipherBytes.slice(0, cipherBytes.length - rem);
            }

            console.log('Decrypting .unifi with static AES-256-CBC key and file IV...');
            const iv = uint8ArrayToWordArray(ivBytes);
            const ciphertext = uint8ArrayToWordArray(cipherBytes);
            const decrypted = CryptoJS.AES.decrypt(
                { ciphertext: ciphertext },
                key,
                {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.NoPadding
                }
            );
            const decryptedBytes = wordArrayToUint8Array(decrypted);

            console.log('Decrypted size:', decryptedBytes.length);
            console.log('Decrypted first 20 bytes:', Array.from(decryptedBytes.slice(0, 20)).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' '));

            if (decryptedBytes.length < 2 || decryptedBytes[0] !== 0x1f || decryptedBytes[1] !== 0x8b) {
                throw new Error('Decrypted .unifi data is not gzip. Decryption may have failed.');
            }

            if (typeof pako === 'undefined') {
                throw new Error('pako library required to decompress .unifi gzip payload');
            }

            // Gunzip may need to strip up to one AES block of trailing NoPadding bytes.
            const tarBytes = gunzipIgnoreTrailingPadding(decryptedBytes);
            console.log('SUCCESS: gunzipped .unifi payload, tar size:', tarBytes.length);
            const files = parseTar(tarBytes);
            if (files.length === 0) {
                throw new Error('TAR archive is empty after decrypting .unifi');
            }
                    console.log('Extracted', files.length, 'files from tar');
            setDecryptedArchive(tarBytes, {
                extension: 'tar',
                mime: 'application/x-tar',
                label: 'Download Decrypted TAR'
            });
            return files;
        }

        function processExtractedFiles(file, files) {
            let backupInfo = null;
            let databases = {};

            for (const f of files) {
                console.log('File:', f.name, 'size:', f.size, 'bytes, first 20 bytes:', f.size > 0 ? Array.from(f.data.slice(0, Math.min(20, f.size))).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' ') : '(empty)');

                        const dataToCheck = f.data instanceof Uint8Array ? f.data : new Uint8Array(f.data);

                        if (dataToCheck.length >= 2 && dataToCheck[0] === 0x1f && dataToCheck[1] === 0x8b && typeof pako !== 'undefined') {
                            try {

                                    size: decompressed.length,
                                    data: decompressed,
                                    isDecompressed: true

                                console.log('Decompressed:', f.name, '->', baseName, 'size:', decompressed.length);
                            } catch (decompressErr) {

            displayBackupContents(file, files, backupInfo, databases);

        function wordArrayToUint8Array(wordArray) {
            const words = wordArray.words;
            const sigBytes = wordArray.sigBytes;
            const u8 = new Uint8Array(sigBytes);
            for (let i = 0; i < sigBytes; i++) {
                u8[i] = (words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
            }
            return u8;
        }

        function uint8ArrayToWordArray(u8Array) {
            const words = [];
            for (let i = 0; i < u8Array.length; i += 4) {
                words.push(
                    (u8Array[i] << 24) |
                    ((u8Array[i + 1] || 0) << 16) |
                    ((u8Array[i + 2] || 0) << 8) |
                    (u8Array[i + 3] || 0)
                );
            }
            return CryptoJS.lib.WordArray.create(words, u8Array.length);
        }

        function evpBytesToKey(password, salt, keyLen, ivLen = 0) {
            // OpenSSL EVP_BytesToKey equivalent using MD5
            const m = [];
            let i = 0;
            
            while (m.length < (keyLen + ivLen)) {
                let hashInput = '';
                if (m.length === 0) {
                    hashInput = password;
                } else {
                    const hex = m[m.length - 1].toString();
                    const bytes = [];
                    for (let j = 0; j < hex.length; j += 2) {
                        bytes.push(String.fromCharCode(parseInt(hex.substr(j, 2), 16)));
                    }
                    hashInput = bytes.join('') + password;
                }
                hashInput += String.fromCharCode.apply(null, salt);
                
                const h = CryptoJS.MD5(CryptoJS.enc.Latin1.parse(hashInput));
                m.push(h.toString(CryptoJS.enc.Hex));
                i++;
            }
            
            const ms = m.join('');
            const result = new Uint8Array(keyLen + ivLen);
            
            for (let i = 0; i < keyLen + ivLen; i++) {
                result[i] = parseInt(ms.substr(i * 2, 2), 16);
            }
            
            return result.slice(0, keyLen + ivLen);
        }

        function parseTar(data) {
            const files = [];
            let offset = 0;
            let pendingLongName = null;

            while (offset + 512 <= data.length) {
                // End of archive: zero block
                if (data[offset] === 0) {
                    let allZero = true;
                    for (let i = 0; i < 512; i++) {
                        if (data[offset + i] !== 0) { allZero = false; break; }
                    }
                    if (allZero) break;
                }

                const header = data.slice(offset, offset + 512);
                const typeflag = String.fromCharCode(header[156] || 0);
                const size = parseInt(readString(header, 124, 12).trim(), 8) || 0;
                const dataStart = offset + 512;
                const dataEnd = dataStart + size;
                const nextOffset = dataStart + Math.ceil(size / 512) * 512;

                // GNU long name: next entry uses this payload as its path
                if (typeflag === 'L') {
                    pendingLongName = readString(data, dataStart, size).replace(/\0+$/, '');
                    offset = nextOffset;
                    continue;
                }

                // Skip directories and special entries
                if (typeflag === '5' || typeflag === '1' || typeflag === '2' ||
                    typeflag === '3' || typeflag === '4' || typeflag === '6' ||
                    typeflag === 'g' || typeflag === 'x') {
                    pendingLongName = null;
                    offset = nextOffset;
                    continue;
                }

                let name;
                if (pendingLongName) {
                    name = pendingLongName;
                    pendingLongName = null;
                } else {
                    const rawName = readString(header, 0, 100);
                    const magic = readString(header, 257, 5);
                    const prefix = magic === 'ustar' ? readString(header, 345, 155) : '';
                    name = prefix ? prefix + '/' + rawName : rawName;
                }
                if (!name) break;

                if (typeflag === '0' || typeflag === '\0' || size > 0) {
                    const fileData = data.slice(dataStart, dataEnd);
                    files.push({ name, size: fileData.length, data: fileData });
                }

                offset = nextOffset;
            }

            return files;
        }
        
        function readString(data, offset, length) {
            let str = '';
            for (let i = 0; i < length; i++) {
                if (data[offset + i] === 0) break;
                str += String.fromCharCode(data[offset + i]);
            }
            return str;
        }
