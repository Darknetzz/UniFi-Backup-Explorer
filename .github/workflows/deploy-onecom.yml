name: Deploy to one.com

on:
  push:
    branches:
      - main
    paths:
      - backup-explorer.html
      - scripts/deploy_onecom.py
      - .github/workflows/deploy-onecom.yml
  workflow_dispatch:

concurrency:
  group: onecom-unifi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        env:
          SSH_DEPLOY_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
          SSH_DEPLOY_PORT: ${{ secrets.SSH_DEPLOY_PORT }}
          SSH_DEPLOY_USERNAME: ${{ secrets.SSH_DEPLOY_USERNAME }}
          SSH_DEPLOY_PASSWORD: ${{ secrets.SSH_DEPLOY_PASSWORD }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet 'paramiko==5.0.0'
          .venv/bin/python scripts/deploy_onecom.py
